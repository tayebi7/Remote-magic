name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build APKs and AAB
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: remote-magic-apk
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/release/*.aab
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/*/*.apk app/build/outputs/bundle/release/*.aab --generate-notes
